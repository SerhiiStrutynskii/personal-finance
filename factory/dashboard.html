<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Фабрика коду</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #16181d;
        --muted: #6b7280;
        --line: #e5e7eb;
        --pass: #15803d;
        --pass-bg: #dcfce7;
        --changes: #b91c1c;
        --changes-bg: #fee2e2;
        --pending: #9ca3af;
        --pending-bg: #f3f4f6;
        --human: #b45309;
        --human-bg: #fef3c7;
        --merged: #1d4ed8;
        --merged-bg: #dbeafe;
        --code-bg: #f3f4f6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1115;
          --panel: #171a21;
          --text: #e6e8ec;
          --muted: #9aa1ad;
          --line: #2a2f3a;
          --pass: #4ade80;
          --pass-bg: #14301f;
          --changes: #f87171;
          --changes-bg: #3a1717;
          --pending: #6b7280;
          --pending-bg: #1f232c;
          --human: #fbbf24;
          --human-bg: #3a2c0d;
          --merged: #93c5fd;
          --merged-bg: #172a46;
          --code-bg: #1f232c;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e6e8ec;
        --muted: #9aa1ad;
        --line: #2a2f3a;
        --pass: #4ade80;
        --pass-bg: #14301f;
        --changes: #f87171;
        --changes-bg: #3a1717;
        --pending: #6b7280;
        --pending-bg: #1f232c;
        --human: #fbbf24;
        --human-bg: #3a2c0d;
        --merged: #93c5fd;
        --merged-bg: #172a46;
        --code-bg: #1f232c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 20px 24px 8px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
      }
      .status.offline {
        color: var(--changes);
      }
      .loop {
        padding: 0 24px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      main {
        padding: 8px 24px 24px;
      }

      .human {
        margin-bottom: 16px;
      }
      .human:empty {
        display: none;
      }
      .human-title {
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--human);
        margin: 0 0 8px;
      }
      .human-cards {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }

      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(200px, 1fr));
        gap: 12px;
      }
      .col {
        background: color-mix(in srgb, var(--panel) 55%, transparent);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        min-height: 120px;
      }
      .col h2 {
        display: flex;
        justify-content: space-between;
        margin: 2px 4px 10px;
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .col .cards {
        display: grid;
        gap: 8px;
      }

      .card {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .card:hover {
        border-color: var(--muted);
      }
      .card:focus-visible {
        outline: 2px solid var(--merged);
        outline-offset: 2px;
      }
      .card.needs-human {
        border: 1.5px solid var(--human);
        background: var(--human-bg);
      }
      .card .id {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--muted);
      }
      .card .title {
        font-weight: 600;
        margin: 2px 0 6px;
        overflow-wrap: anywhere;
      }
      .card .note {
        font-size: 12px;
        color: var(--human);
        margin-top: 6px;
      }
      .card .meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      .round {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .round .n {
        width: 22px;
        font-size: 11px;
        color: var(--muted);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 20px;
        padding: 0 5px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 650;
      }
      .chip.PASS {
        color: var(--pass);
        background: var(--pass-bg);
      }
      .chip.CHANGES {
        color: var(--changes);
        background: var(--changes-bg);
      }
      .chip.pending {
        color: var(--pending);
        background: var(--pending-bg);
      }
      .badge {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 650;
      }
      .badge.APPROVE,
      .badge.merged {
        color: var(--merged);
        background: var(--merged-bg);
      }
      .badge.ESCALATE {
        color: var(--human);
        background: var(--human-bg);
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 4px;
      }

      /* Панель із файлами задачі */
      .drawer-bg {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.25);
        display: none;
      }
      .drawer-bg.open {
        display: block;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(760px, 100%);
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .drawer header {
        padding: 16px 20px 8px;
        align-items: center;
      }
      .drawer h3 {
        margin: 0;
        font-size: 16px;
        overflow-wrap: anywhere;
      }
      .close {
        font: inherit;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 20px 12px;
        border-bottom: 1px solid var(--line);
      }
      .file {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
      }
      .file[aria-pressed='true'] {
        background: var(--text);
        color: var(--panel);
        border-color: var(--text);
      }
      .doc {
        overflow-y: auto;
        padding: 8px 20px 32px;
      }
      .doc h1,
      .doc h2,
      .doc h3 {
        font-size: 15px;
        margin: 18px 0 6px;
      }
      .doc h1 {
        font-size: 17px;
      }
      .doc p,
      .doc ul,
      .doc ol {
        margin: 6px 0;
      }
      .doc code {
        font:
          12.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: var(--code-bg);
        padding: 1px 4px;
        border-radius: 4px;
      }
      .doc pre {
        background: var(--code-bg);
        padding: 10px 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .doc pre code {
        background: none;
        padding: 0;
      }
      .doc table {
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 13px;
      }
      .doc th,
      .doc td {
        border: 1px solid var(--line);
        padding: 4px 8px;
        text-align: left;
        vertical-align: top;
      }
      .doc .verdict {
        display: inline-block;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
        margin: 8px 0;
      }
      .doc .verdict.PASS,
      .doc .verdict.APPROVE {
        color: var(--pass);
        background: var(--pass-bg);
      }
      .doc .verdict.CHANGES {
        color: var(--changes);
        background: var(--changes-bg);
      }
      .doc .verdict.ESCALATE {
        color: var(--human);
        background: var(--human-bg);
      }

      @media (max-width: 900px) {
        header,
        .loop,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        .board {
          grid-template-columns: 1fr;
        }
        .col {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Фабрика коду</h1>
      <span class="status" id="status">завантаження…</span>
    </header>
    <div class="loop">
      фіча → spec-writer → builder ⇄ рев'ю (S безпека · U UX · I UI · C код) → approver → main або
      людина
    </div>
    <main>
      <section class="human" id="human"></section>
      <div class="board" id="board"></div>
    </main>

    <div class="drawer-bg" id="drawer-bg">
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header>
          <h3 id="drawer-title"></h3>
          <button class="close" id="close" type="button">Закрити</button>
        </header>
        <nav class="files" id="files" aria-label="Файли задачі"></nav>
        <article class="doc" id="doc"></article>
      </aside>
    </div>

    <script>
      const COLUMNS = [
        { stage: 'spec', title: 'Специфікація' },
        { stage: 'build', title: 'Збірка' },
        { stage: 'review', title: "Рев'ю" },
        { stage: 'approval', title: 'Рішення' },
        { stage: 'merged', title: 'Злито' },
      ];
      const REVIEWERS = [
        ['security', 'S', 'безпека'],
        ['ux', 'U', 'UX'],
        ['ui', 'I', 'UI'],
        ['code', 'C', 'код'],
      ];
      const POLL_MS = 2000;

      let jobs = [];
      let openJob = null;
      let openFile = null;
      let lastJson = '';

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      function ago(iso) {
        if (!iso) return '';
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return 'щойно';
        if (s < 3600) return `${Math.floor(s / 60)} хв тому`;
        if (s < 86400) return `${Math.floor(s / 3600)} год тому`;
        return new Date(iso).toLocaleDateString('uk-UA');
      }

      function roundRow(n, reviews) {
        const chips = REVIEWERS.map(([key, letter, label]) => {
          const v = reviews?.[key] ?? 'pending';
          return `<span class="chip ${esc(v)}" title="${label}: ${esc(v)}">${letter}</span>`;
        }).join('');
        return `<div class="round"><span class="n">R${n}</span>${chips}</div>`;
      }

      function card(job) {
        const done = job.rounds ?? [];
        const rows = done.map((r) => roundRow(r.round, r.reviews));
        if (job.stage === 'review' && !done.some((r) => r.round === job.round)) {
          rows.push(roundRow(job.round, job.reviews));
        }
        const human = job.stage === 'needs-human';
        const decision = job.decision
          ? `<span class="badge ${esc(job.decision)}">${esc(job.decision)}</span>`
          : '';
        return `<button type="button" class="card${human ? ' needs-human' : ''}" data-id="${esc(job.id)}">
      <div class="id">${esc(job.id)}</div>
      <div class="title">${esc(job.title ?? job.id)}</div>
      ${rows.join('')}
      ${human && job.note ? `<div class="note">${esc(job.note)}</div>` : ''}
      <div class="meta"><span>${decision}</span><span>${esc(ago(job.updatedAt))}</span></div>
    </button>`;
      }

      function render() {
        const human = jobs.filter((j) => j.stage === 'needs-human');
        $('human').innerHTML = human.length
          ? `<h2 class="human-title">Потрібна людина · ${human.length}</h2>
         <div class="human-cards">${human.map(card).join('')}</div>`
          : '';
        $('board').innerHTML = COLUMNS.map(({ stage, title }) => {
          const list = jobs.filter((j) => j.stage === stage);
          return `<section class="col"><h2><span>${title}</span><span>${list.length}</span></h2>
        <div class="cards">${list.map(card).join('') || '<div class="empty">—</div>'}</div></section>`;
        }).join('');
      }

      async function poll() {
        try {
          const res = await fetch('board.json', { cache: 'no-store' });
          if (!res.ok) throw new Error(res.status);
          const text = await res.text();
          $('status').textContent = `оновлено ${new Date().toLocaleTimeString('uk-UA')}`;
          $('status').classList.remove('offline');
          if (text !== lastJson) {
            lastJson = text;
            jobs = (JSON.parse(text).jobs ?? [])
              .slice()
              .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
            render();
            if (openJob) renderFiles();
          }
        } catch {
          $('status').textContent = 'немає board.json — запустіть сервер із папки factory/';
          $('status').classList.add('offline');
        }
      }

      // --- Файли задачі ---

      function currentJob() {
        return jobs.find((j) => j.id === openJob);
      }

      function renderFiles() {
        const job = currentJob();
        if (!job) return;
        const files = job.files ?? [];
        $('drawer-title').textContent = `${job.id} · ${job.title ?? ''}`;
        $('files').innerHTML =
          files
            .map(
              (f) =>
                `<button type="button" class="file" data-file="${esc(f)}" aria-pressed="${f === openFile}">${esc(f)}</button>`,
            )
            .join('') || '<span class="empty">Файлів ще немає</span>';
        if (!openFile && files.length) showFile(files[files.length - 1]);
      }

      async function showFile(file) {
        openFile = file;
        for (const b of $('files').querySelectorAll('.file')) {
          b.setAttribute('aria-pressed', String(b.dataset.file === file));
        }
        $('doc').innerHTML = '<p class="empty">Завантаження…</p>';
        try {
          const res = await fetch(
            `jobs/${encodeURIComponent(openJob)}/${file.split('/').map(encodeURIComponent).join('/')}`,
            { cache: 'no-store' },
          );
          if (!res.ok) throw new Error(res.status);
          $('doc').innerHTML = markdown(await res.text());
        } catch {
          $('doc').innerHTML = '<p class="empty">Файл недоступний.</p>';
        }
      }

      function openDrawer(id) {
        openJob = id;
        openFile = null;
        $('drawer-bg').classList.add('open');
        renderFiles();
        $('close').focus();
      }

      function closeDrawer() {
        $('drawer-bg').classList.remove('open');
        openJob = null;
      }

      // --- Мінімальний markdown: заголовки, списки, код, таблиці, жирний, вердикт ---

      function inline(s) {
        return esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      }

      function markdown(src) {
        const lines = src.replace(/\r/g, '').split('\n');
        const out = [];
        let i = 0;
        const first = lines.findIndex((l) => l.trim());
        const verdict =
          first >= 0 &&
          /^(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/.exec(lines[first].trim());
        if (verdict) {
          out.push(`<div class="verdict ${verdict[2]}">${esc(lines[first].trim())}</div>`);
          i = first + 1;
        }
        while (i < lines.length) {
          const line = lines[i];
          if (/^```/.test(line)) {
            const code = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
            i++;
            out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
          } else if (/^#{1,6}\s/.test(line)) {
            const level = Math.min(3, line.match(/^#+/)[0].length);
            out.push(`<h${level}>${inline(line.replace(/^#+\s*/, ''))}</h${level}>`);
            i++;
          } else if (/^\s*\|.*\|\s*$/.test(line)) {
            const rows = [];
            while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
            const cells = (r) =>
              r
                .trim()
                .slice(1, -1)
                .split('|')
                .map((c) => c.trim());
            const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
            out.push(
              '<table>' +
                body
                  .map(
                    (r, n) =>
                      `<tr>${cells(r)
                        .map((c) => (n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`))
                        .join('')}</tr>`,
                  )
                  .join('') +
                '</table>',
            );
          } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
            const ordered = /^\s*\d+\./.test(line);
            const items = [];
            while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) {
              let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s/, '');
              // продовження пункту з відступом
              while (
                i < lines.length &&
                /^\s{2,}\S/.test(lines[i]) &&
                !/^\s*([-*]|\d+\.)\s/.test(lines[i])
              ) {
                item += ' ' + lines[i++].trim();
              }
              items.push(`<li>${inline(item)}</li>`);
            }
            out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
          } else if (line.trim()) {
            const para = [];
            while (
              i < lines.length &&
              lines[i].trim() &&
              !/^(#|```|\s*([-*]|\d+\.)\s|\s*\|)/.test(lines[i])
            ) {
              para.push(lines[i++]);
            }
            out.push(`<p>${inline(para.join(' '))}</p>`);
          } else {
            i++;
          }
        }
        return out.join('\n');
      }

      // --- Події ---

      document.addEventListener('click', (e) => {
        const cardEl = e.target.closest('.card');
        if (cardEl) return openDrawer(cardEl.dataset.id);
        const fileEl = e.target.closest('.file');
        if (fileEl) return showFile(fileEl.dataset.file);
        if (e.target === $('drawer-bg') || e.target === $('close')) closeDrawer();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && openJob) closeDrawer();
      });

      poll();
      setInterval(poll, POLL_MS);
      setInterval(render, 60_000); // «N хв тому»
    </script>
  </body>
</html>
