# Продакшн-розгортання на одному сервері: база, застосунок і Caddy з HTTPS.
# Значення беруться з файлу .env поруч (див. .env.example); інструкція — docs/deploy.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: personal_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_finance -d personal_finance']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${APP_IMAGE:-personal-finance-app}:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://personal_finance:${POSTGRES_PASSWORD}@db:5432/personal_finance
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET у .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN у .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертифікати мають переживати перезапуск, інакше їх доведеться отримувати заново.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
