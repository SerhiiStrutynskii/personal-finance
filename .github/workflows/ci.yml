name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hf
          POSTGRES_PASSWORD: hf
          POSTGRES_DB: personal_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hf -d personal_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Тести API очищають таблиці, тому працюють лише з базою, назва якої закінчується на _test.
      TEST_DATABASE_URL: postgres://hf:hf@localhost:5432/personal_finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personal-finance .
